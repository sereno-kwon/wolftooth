<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WOLF TOOTH KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/tools, /pack-pliers ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/wolftooth/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/wolftooth/' : '/';
  var key = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase();
  var alias = { 'chainring':'drivetrain', 'chainrings':'drivetrain', 'drop-stop':'drivetrain', 'goatlink':'drivetrain', 'roadlink':'drivetrain', 'tanpan':'drivetrain',
                'remote':'cockpit', 'dropper':'cockpit', 'resolve':'cockpit', 'grips':'cockpit', 'headset':'cockpit',
                'tool':'tools', 'pack-pliers':'tools', '8-bit':'tools', 'encase':'tools', 'tekton':'tools',
                'morse':'mounts', 'b-rad':'mounts', 'brad':'mounts', 'cages':'mounts',
                'hydra':'wheels', 'hubs':'wheels', 'waveform':'wheels', 'pedals':'wheels', 'valves':'wheels',
                'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'compatibility':'fit', 'lineup':'range' };
  var map = { brand:1, range:1, drivetrain:1, cockpit:1, tools:1, mounts:1, wheels:1, colors:1, fit:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
